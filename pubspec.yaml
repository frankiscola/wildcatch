name: wildkin
description: >
  Capture real animals and turn them into retro-style Wildkin,
  shaped by the weather, place, and time of the capture.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Backend
  supabase_flutter: ^2.5.6

  # Camera / gallery
  image_picker: ^1.1.2
  camera: ^0.12.1

  # Location, weather, geocoding
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  http: ^1.2.2

  # On-device species recognition: free, offline, no API key needed
  google_mlkit_image_labeling: ^0.16.1

  # Anti-photo-of-a-screen (see lib/services/liveness_service.dart):
  # - image: frame decoding/analysis for the parallax score
  # - sensors_plus: gyroscope, to check the phone genuinely moved
  #   physically during the shot ("poor man's AR")
  # Both pure logic/native sensors: zero recurring cost.
  image: ^4.2.0
  sensors_plus: ^6.0.1

  # Remembers whether the initial tutorial has already been shown
  shared_preferences: ^2.3.2

  # Retro RPG-style fonts
  google_fonts: ^8.2.1

  # Utilities
  intl: ^0.20.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/type_badges/
