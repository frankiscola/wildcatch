name: wildcatch
description: >
  Cattura animali reali e trasformali in creature in stile retro,
  influenzate da meteo, luogo e ora della cattura.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Backend
  supabase_flutter: ^2.5.6

  # Fotocamera / galleria
  image_picker: ^1.1.2
  camera: ^0.12.1

  # Posizione, meteo, geocoding
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  http: ^1.2.2

  # Riconoscimento specie on-device: gratuito, offline, nessuna API key
  google_mlkit_image_labeling: ^0.16.1

  # Anti-cattura-da-internet/rivista (vedi lib/services/liveness_service.dart):
  # - image: decodifica/analisi dei frame per il punteggio di parallasse
  # - sensors_plus: giroscopio, per verificare che il telefono si sia
  #   davvero mosso fisicamente durante lo scatto ("poor man's AR")
  # Entrambe pure logica/sensori nativi: zero costi ricorrenti.
  image: ^4.2.0
  sensors_plus: ^6.0.1

  # Font pixel-art in stile GBA
  google_fonts: ^8.2.1

  # Utility
  intl: ^0.20.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
